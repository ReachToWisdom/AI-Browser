name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            let releaseId;
            const tagName = `${context.ref.replace('refs/tags/', '')}`;
            const bodyContent = `## 변경사항\n            - **탭 전환 및 환경설정 정상화**: 모든 탭 웹뷰 사전 생성으로 즉각적인 탭 전환 및 환경설정 창 열기 보장\n            - **답변 내 외부 링크 열기 지원**: AI 답변 결과 속 외부 링크 클릭 시 시스템 기본 브라우저(Chrome/Edge 등)로 정상 오픈\n            - **대표 AI 목록 순서 정렬**: Claude, Codex, Gemini, Meta AI 순서로 최우선 배치\n            - **신규 AI 추가**: 국내 AI 모티프(Motif) 및 Meta AI 기본 목록/프리셋 추가\n\n            **제작자**: 혜통\n\n            ## 다운로드\n            - **Windows**: AI-Browser_*_x64-setup.exe\n            - **macOS (Apple Silicon)**: AI-Browser_*_aarch64.dmg\n            - **macOS (Intel)**: AI-Browser_*_x64.dmg\n\n            ## 자동 업데이트\n            이전 버전 사용자는 앱 실행 시 자동으로 업데이트 알림을 받게 됩니다.`;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              releaseId = existing.data.id;
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: `AI Browser ${tagName}`,
                body: bodyContent,
              });
            } catch (e) {
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: `AI Browser ${tagName}`,
                body: bodyContent,
                draft: false,
                prerelease: false,
              });
              releaseId = created.data.id;
            }
            return releaseId;


  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: |
          npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload Release Asset (macOS)
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (Windows)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
